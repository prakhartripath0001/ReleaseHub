apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: releasehub
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog-service }
  template:
    metadata:
      labels: { app: catalog-service }
    spec:
      containers:
        - name: catalog-service
          image: ghcr.io/prakhartripath0001/releasehub-catalog-service:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: releasehub-config }
            - secretRef: { name: releasehub-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: releasehub
spec:
  selector: { app: catalog-service }
  ports: [{ port: 8083, targetPort: 8083 }]
---
