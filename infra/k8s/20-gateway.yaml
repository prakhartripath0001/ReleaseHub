apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: releasehub
spec:
  replicas: 1
  selector:
    matchLabels: { app: kong }
  template:
    metadata:
      labels: { app: kong }
    spec:
      containers:
        - name: kong
          image: kong:3.9
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              value: "off"
            - name: KONG_PLUGINS
              value: bundled
          ports: [{ containerPort: 8000 }]
          volumeMounts:
            - name: kong-config
              mountPath: /kong
              readOnly: true
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: releasehub
spec:
  type: ClusterIP
  selector: { app: kong }
  ports: [{ name: proxy, port: 8000, targetPort: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: releasehub
  namespace: releasehub
  annotations:
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8083
          - path: /api/search
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  number: 8084
          - path: /api/feedback
            pathType: Prefix
            backend:
              service:
                name: feedback-service
                port:
                  number: 8085
          - path: /api/reports
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 8086
