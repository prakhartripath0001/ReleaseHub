version: '3'
services:
  db:
    image: mysql:8
    container_name: ReleaseHub
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=release@123
      - MYSQL_DATABASE=releasehub
    volumes:
      - releasehub_db:/var/lib/mysql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: releasehub-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - releasehub_es:/usr/share/elasticsearch/data

volumes:
  releasehub_db:
  releasehub_es:
