global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: releasehub
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - catalog-service:8083
          - search-service:8084
          - feedback-service:8085
          - analytics-service:8086
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
