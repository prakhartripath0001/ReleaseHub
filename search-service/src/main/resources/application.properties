spring.application.name=search-service
server.port=8084

# Same MySQL catalog owns. This service only reads software and version rows.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:releasehub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:release@123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

releasehub.elasticsearch.uri=${ELASTICSEARCH_URI:http://localhost:9200}
releasehub.search.alias=software
releasehub.search.index-prefix=software_v

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
